name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:i18n
      - name: Verify committed release assets
        run: npm run verify:release
      - run: node --check main.js
      - run: npm run build
      - run: npm run verify:release
      - run: node --check main.js
      - run: npx eslint src/ --max-warnings=0
      - name: Verify community candidate excludes the ACP installer
        run: npm run build:community
